<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAFE メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <header class="bg-white shadow px-6 py-4">
      <h1 class="text-2xl font-bold text-gray-800">CAFE</h1>
      <p class="text-gray-600 text-sm mt-1">Sweets cafe</p>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
      <section class="mb-8">
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Sweets　メニュー</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg">
          <h3 class="text-lg font-bold text-gray-900">Strawberry cup cake</h3>
          <p class="text-gray-600 mt-1">本日のおすすめ。イチゴの甘酸っぱさが特徴です。</p>
          <img src="./image/スクリーンショット_30-5-2026_151033_www.bing.com.jpeg" alt="Strawberry cup cake" class="rounded-full w-72 mt-2">
          <p class="text-blue-600 font-bold mt-2">570円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg">
          <h3 class="text-lg font-bold text-gray-900">Orange pound cake</h3>
          <p class="text-gray-600 mt-1">柑橘系の香りが特徴です。</p>
          <img src="./image/スクリーンショット_30-5-2026_151615_www.bing.com.jpeg" alt="Orange pound cake" class="rounded-full w-72 mt-2">
          <p class="text-blue-600 font-bold mt-2">700円</p>
        </div>
        
        <div class ="bg-white round ed-lg shadow p-6 mb-4 hover:shadow-lg">
          <h3 class="text-lg font-bold text-gray-900">Chocolate cake</h3>
          <p class="text-gray-600 mt-1">濃厚なチョコレートの味わい。</p>
          <img src="./image/スクリーンショット_30-5-2026_154129_www.bing.com.jpeg" alt="Chocolate cake" class="rounded-full w-72 mt-2">
          <p class="text-blue-600 font-bold mt-2">650円</p>
        
        </div>
      </section>
    </main>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <section class="bg-gray-50">
            <h2 class ="text-2xl font-bold bg-gray-100">Drink　メニュー</h2>
            
            <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg">
                <h3 class=" font-bold text-gray-900">Cappuccino</h3>
                <p class="text-gray-600 mt-1">香り高いカプチーノ。</p>
                <img src="./image/スクリーンショット_30-5-2026_145210_www.bing.com.jpeg" alt="Cappuccino" class="rounded-full w-72 h-72 object-cover mt-2">
                <p class="text-blue-600 font-bold mt-2">400円</p>
            </div>

            <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg">
                <h3 class="text-lg font-bold text-gray-900">Latte</h3>
                <p class="text-gray-600 mt-1">スッキリとしたコーヒーの味わい。</p>
                <img src="./image/スクリーンショット_30-5-2026_15538_www.bing.com.jpeg" alt="Latte" class="rounded-full w-72 h-72 object-cover mt-2">
                <p class="text-blue-600 font-bold mt-2">350円</p>
            </div>

            <div class="bg-white rounded-lg shadow p-6 mb-4 hover:shadow-lg">
                <h3 class="text-lg font-bold text-gray-900">Tea</h3>
                <p class="text-gray-600 mt-1">桃風味のフルーティーな紅茶。</p>
                <img src="./image/スクリーンショット_30-5-2026_142858_www.bing.com.jpeg" alt="Tea" class="rounded-full w-72 mt-2">
                <p class="text-blue-600 font-bold mt-2">500円</p>
            </div>

        </section>
    </main>

    <footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">
      <p>2026 CAFE</p>
    </footer>
  </body>
</html>
